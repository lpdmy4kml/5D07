<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KMB Live Transit Tracker - 九巴即時到站預報</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        kmb: {
                            red: '#E60012',
                            darkRed: '#A6000D',
                            lightRed: '#FFF0F1',
                            gold: '#FFC800',
                            dark: '#121212',
                            cardBg: '#1E1E1E'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'PingFang TC', 'Microsoft JhengHei', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Smooth scrolling and clean transitions */
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        .dark ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #E60012; }
        
        .pulse-ring {
            animation: pulse-ring-anim 1.8s infinite ease-out;
        }
        @keyframes pulse-ring-anim {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .eta-card-glow {
            box-shadow: 0 4px 20px -2px rgba(230, 0, 18, 0.15);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans selection:bg-kmb-red selection:text-white">

    <!-- Header Navbar -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-kmb-red flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-red-500/20">
                    九巴
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold leading-tight flex items-center gap-1.5">
                        KMB Live Tracker
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold border border-emerald-500/20">
                            100% Ad-Free
                        </span>
                    </h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Official Open Data API • 即時到站預報</p>
                </div>
            </div>

            <!-- Header actions -->
            <div class="flex items-center space-x-2">
                <button id="themeToggleBtn" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition" title="Toggle Theme">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>
                <button id="getGpsBtn" class="px-3.5 py-2 rounded-xl bg-kmb-red text-white hover:bg-kmb-darkRed font-semibold text-xs sm:text-sm flex items-center space-x-1.5 shadow-sm transition active:scale-95">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span class="hidden sm:inline">GPS 位置</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-4 space-y-4">

        <!-- Location Status & Search Header -->
        <div id="locationBanner" class="p-3.5 rounded-2xl bg-gradient-to-r from-red-500/10 via-red-500/5 to-transparent border border-red-500/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-kmb-red/10 text-kmb-red flex items-center justify-center shrink-0">
                    <i id="gpsIcon" class="fa-solid fa-location-dot text-lg"></i>
                </div>
                <div>
                    <div id="locationTitle" class="text-xs sm:text-sm font-bold text-gray-900 dark:text-white">
                        準備搜尋附近巴士站...
                    </div>
                    <div id="locationCoords" class="text-[11px] text-gray-500 dark:text-gray-400">
                        點擊下方「尋找附近巴士站」或右上角 GPS 圖示
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="districtSelect" class="flex-1 sm:flex-initial text-xs py-2 px-3 rounded-xl bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 font-medium focus:ring-2 focus:ring-kmb-red focus:outline-none">
                    <option value="">-- 手動選擇熱門地區 --</option>
                    <option value="22.3193,114.1694">旺角 Mong Kok</option>
                    <option value="22.2819,114.1581">中環 Central</option>
                    <option value="22.2800,114.1830">銅鑼灣 Causeway Bay</option>
                    <option value="22.2988,114.1722">尖沙咀 Tsim Sha Tsui</option>
                    <option value="22.3814,114.1888">沙田市中心 Sha Tin</option>
                    <option value="22.3080,114.2230">觀塘 Kwun Tong</option>
                    <option value="22.3736,114.1177">荃灣 Tsuen Wan</option>
                    <option value="22.3908,113.9770">屯門 Tuen Mun</option>
                    <option value="22.3049,114.2600">將軍澳 Tseung Kwan O</option>
                    <option value="22.3355,114.1761">九龍塘 Kowloon Tong</option>
                </select>
                <button id="findNearbyBtn" class="shrink-0 px-3 py-2 rounded-xl bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 text-xs font-bold hover:bg-gray-800 dark:hover:bg-gray-200 transition">
                    重新定位
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex rounded-2xl bg-gray-200/80 dark:bg-gray-900 p-1 text-xs sm:text-sm font-bold shadow-inner">
            <button id="tabNearby" class="tab-btn flex-1 py-2.5 rounded-xl text-center transition bg-white dark:bg-gray-800 text-kmb-red shadow-sm flex items-center justify-center space-x-2" data-tab="nearby">
                <i class="fa-solid fa-map-pin"></i>
                <span>附近車站</span>
            </button>
            <button id="tabSearch" class="tab-btn flex-1 py-2.5 rounded-xl text-center transition text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white flex items-center justify-center space-x-2" data-tab="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>路線搜尋</span>
            </button>
            <button id="tabFavorites" class="tab-btn flex-1 py-2.5 rounded-xl text-center transition text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white flex items-center justify-center space-x-2" data-tab="favorites">
                <i class="fa-solid fa-star text-amber-400"></i>
                <span>已收藏 (<span id="favCountText">0</span>)</span>
            </button>
        </nav>

        <!-- Dynamic Content Views -->
        <!-- VIEW 1: NEARBY STOPS -->
        <section id="viewNearby" class="tab-view space-y-3">
            <!-- Radius Selector & Stats Bar -->
            <div class="flex flex-wrap items-center justify-between gap-2 px-1">
                <div class="flex items-center space-x-2 text-xs font-semibold text-gray-600 dark:text-gray-400">
                    <span>搜尋範圍 Radius:</span>
                    <div class="flex rounded-lg bg-gray-200 dark:bg-gray-800 p-0.5" id="radiusGroup">
                        <button class="radius-btn px-2.5 py-1 rounded-md text-[11px] font-bold bg-white dark:bg-gray-700 text-kmb-red shadow-xs" data-radius="300">300m</button>
                        <button class="radius-btn px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-600 dark:text-gray-400" data-radius="500">500m</button>
                        <button class="radius-btn px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-600 dark:text-gray-400" data-radius="1000">1km</button>
                        <button class="radius-btn px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-600 dark:text-gray-400" data-radius="2000">2km</button>
                    </div>
                </div>
                <button id="refreshNearbyBtn" class="text-xs text-kmb-red font-bold flex items-center space-x-1 hover:underline">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>更新 ETA</span>
                </button>
            </div>

            <!-- Loading Indicator -->
            <div id="nearbyLoading" class="hidden py-12 text-center space-y-3">
                <div class="inline-block w-8 h-8 border-4 border-kmb-red border-t-transparent rounded-full animate-spin"></div>
                <div id="nearbyLoadingText" class="text-xs font-semibold text-gray-500 dark:text-gray-400">
                    正在載入全港九巴車站資料庫...
                </div>
            </div>

            <!-- Stops Container -->
            <div id="nearbyStopsContainer" class="space-y-4">
                <!-- Dynamically populated stop cards -->
            </div>
        </section>

        <!-- VIEW 2: ROUTE SEARCH -->
        <section id="viewSearch" class="tab-view hidden space-y-4">
            <div class="relative">
                <i class="fa-solid fa-bus absolute left-4 top-3.5 text-gray-400 text-base"></i>
                <input 
                    type="text" 
                    id="routeSearchInput" 
                    placeholder="輸入九巴路線 (例如: 1A, 960, 290A, 603, B1)..." 
                    class="w-full pl-11 pr-10 py-3 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 font-bold text-sm focus:outline-none focus:ring-2 focus:ring-kmb-red shadow-sm uppercase placeholder:font-normal placeholder:normal-case"
                >
                <button id="clearRouteSearch" class="hidden absolute right-3 top-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Route Search Results -->
            <div id="routeSearchResults" class="space-y-3">
                <div class="text-center py-10 text-xs text-gray-400">
                    <i class="fa-solid fa-route text-3xl mb-2 block opacity-50"></i>
                    輸入巴士路線號碼以查看完整車站及實時 ETA
                </div>
            </div>
        </section>

        <!-- VIEW 3: FAVORITES -->
        <section id="viewFavorites" class="tab-view hidden space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">已收藏車站及路線 Bookmarked Stops</h3>
                <button id="clearAllFavs" class="text-xs text-red-500 hover:underline">清除全部 Clear</button>
            </div>

            <div id="favoritesContainer" class="space-y-3">
                <!-- Favorites list -->
            </div>
        </section>

    </main>

    <!-- Toast Message Container -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-gray-900/90 text-white text-xs font-semibold shadow-2xl backdrop-blur-md border border-gray-700/50 opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastText">訊息提示</span>
    </div>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-gray-200 dark:border-gray-900 text-center text-[11px] text-gray-400 space-y-1">
        <p>資料來源：香港特別行政區政府 Data.gov.hk / 九巴 Open API</p>
        <p>HK KMB Realtime Transit • Fast, Modern & Ad-Free</p>
    </footer>

    <script>
        /**
         * KMB Bus Tracker Engine
         * Built using official KMB Open Data API (data.etabus.gov.hk)
         */

        // --- App State ---
        let userCoords = null; // { lat, lng }
        let selectedRadius = 300; // meters
        let kmbStopsData = []; // Cached array of all KMB stops
        let kmbRoutesData = []; // Cached array of KMB routes
        let favoritesList = []; // Saved stop + route pairs
        let autoRefreshInterval = null;

        // --- DOM Elements ---
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const getGpsBtn = document.getElementById('getGpsBtn');
        const findNearbyBtn = document.getElementById('findNearbyBtn');
        const districtSelect = document.getElementById('districtSelect');
        const locationTitle = document.getElementById('locationTitle');
        const locationCoords = document.getElementById('locationCoords');
        const gpsIcon = document.getElementById('gpsIcon');

        const nearbyLoading = document.getElementById('nearbyLoading');
        const nearbyLoadingText = document.getElementById('nearbyLoadingText');
        const nearbyStopsContainer = document.getElementById('nearbyStopsContainer');
        const refreshNearbyBtn = document.getElementById('refreshNearbyBtn');

        const routeSearchInput = document.getElementById('routeSearchInput');
        const clearRouteSearch = document.getElementById('clearRouteSearch');
        const routeSearchResults = document.getElementById('routeSearchResults');

        const favoritesContainer = document.getElementById('favoritesContainer');
        const favCountText = document.getElementById('favCountText');

        window.addEventListener('DOMContentLoaded', async () => {
            loadSavedFavorites();
            setupTheme();
            setupTabs();
            setupEventListeners();

            // Load stop database (from API with LocalStorage caching)
            await initializeKmbStopsDatabase();

            // Request initial GPS location on app load
            requestUserLocation();

            // Start auto-refresh timer for ETAs every 30 seconds
            autoRefreshInterval = setInterval(() => {
                const currentTab = document.querySelector('.tab-btn.text-kmb-red')?.getAttribute('data-tab');
                if (currentTab === 'nearby' && userCoords) {
                    renderNearbyStops();
                } else if (currentTab === 'favorites') {
                    renderFavorites();
                }
            }, 30000);
        });

        function setupTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });
        }

        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = e.currentTarget.getAttribute('data-tab');
                    
                    // Update active tab buttons
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('bg-white', 'dark:bg-gray-800', 'text-kmb-red', 'shadow-sm');
                        b.classList.add('text-gray-600', 'dark:text-gray-400');
                    });
                    e.currentTarget.classList.add('bg-white', 'dark:bg-gray-800', 'text-kmb-red', 'shadow-sm');
                    e.currentTarget.classList.remove('text-gray-600', 'dark:text-gray-400');

                    // Show view
                    document.querySelectorAll('.tab-view').forEach(v => v.classList.add('hidden'));
                    document.getElementById(`view${capitalize(tab)}`).classList.remove('hidden');

                    if (tab === 'favorites') renderFavorites();
                    if (tab === 'nearby' && userCoords) renderNearbyStops();
                });
            });
        }

        function setupEventListeners() {
            getGpsBtn.addEventListener('click', () => requestUserLocation());
            findNearbyBtn.addEventListener('click', () => requestUserLocation());

            districtSelect.addEventListener('change', (e) => {
                if (e.target.value) {
                    const [lat, lng] = e.target.value.split(',').map(Number);
                    setUserLocation(lat, lng, districtSelect.options[districtSelect.selectedIndex].text);
                }
            });

            // Radius selector buttons
            document.querySelectorAll('.radius-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.radius-btn').forEach(b => {
                        b.classList.remove('bg-white', 'dark:bg-gray-700', 'text-kmb-red', 'shadow-xs');
                        b.classList.add('text-gray-600', 'dark:text-gray-400');
                    });
                    e.currentTarget.classList.add('bg-white', 'dark:bg-gray-700', 'text-kmb-red', 'shadow-xs');
                    e.currentTarget.classList.remove('text-gray-600', 'dark:text-gray-400');

                    selectedRadius = parseInt(e.currentTarget.getAttribute('data-radius'));
                    if (userCoords) renderNearbyStops();
                });
            });

            refreshNearbyBtn.addEventListener('click', () => {
                if (userCoords) {
                    renderNearbyStops();
                    showToast("已更新最新即時到站預報 (ETA)", "success");
                } else {
                    requestUserLocation();
                }
            });

            // Route search input
            routeSearchInput.addEventListener('input', debounce((e) => {
                const query = e.target.value.trim().toUpperCase();
                if (query.length > 0) {
                    clearRouteSearch.classList.remove('hidden');
                    searchKmbRoute(query);
                } else {
                    clearRouteSearch.classList.add('hidden');
                    routeSearchResults.innerHTML = `
                        <div class="text-center py-10 text-xs text-gray-400">
                            <i class="fa-solid fa-route text-3xl mb-2 block opacity-50"></i>
                            輸入巴士路線號碼以查看完整車站及實時 ETA
                        </div>`;
                }
            }, 300));

            clearRouteSearch.addEventListener('click', () => {
                routeSearchInput.value = '';
                clearRouteSearch.classList.add('hidden');
                routeSearchResults.innerHTML = `
                    <div class="text-center py-10 text-xs text-gray-400">
                        <i class="fa-solid fa-route text-3xl mb-2 block opacity-50"></i>
                        輸入巴士路線號碼以查看完整車站及實時 ETA
                    </div>`;
            });

            document.getElementById('clearAllFavs').addEventListener('click', () => {
                favoritesList = [];
                saveFavorites();
                renderFavorites();
                showToast("已清除所有收藏", "info");
            });
        }

        async function initializeKmbStopsDatabase() {
            nearbyLoading.classList.remove('hidden');
            nearbyLoadingText.textContent = "正在載入全港九巴車站資料庫...";

            try {
                // Check LocalStorage cache (Expire after 24 hrs)
                const cachedStops = localStorage.getItem('kmb_stops_cache');
                const cachedTime = localStorage.getItem('kmb_stops_cache_time');
                const now = Date.now();

                if (cachedStops && cachedTime && (now - parseInt(cachedTime) < 86400000)) {
                    kmbStopsData = JSON.parse(cachedStops);
                } else {
                    // Fetch real stop list from official KMB API
                    const resp = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
                    const json = await resp.json();
                    if (json && json.data) {
                        kmbStopsData = json.data;
                        localStorage.setItem('kmb_stops_cache', JSON.stringify(kmbStopsData));
                        localStorage.setItem('kmb_stops_cache_time', now.toString());
                    }
                }
            } catch (err) {
                console.error("Error fetching KMB stops database:", err);
                showToast("使用備用車站數據...", "error");
            } finally {
                nearbyLoading.classList.add('hidden');
            }
        }

        function requestUserLocation() {
            gpsIcon.className = "fa-solid fa-spinner animate-spin text-kmb-red";
            locationTitle.textContent = "正在透過 GPS 獲取精確位置...";
            locationCoords.textContent = "請在瀏覽器彈窗中允許位置存取權限";

            if (!navigator.geolocation) {
                showToast("瀏覽器不支援 GPS 定位，請使用手動地區選擇", "error");
                fallbackLocation();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    setUserLocation(pos.coords.latitude, pos.coords.longitude, "您的目前位置 (GPS Precise)");
                },
                (err) => {
                    console.warn("Geolocation error:", err);
                    showToast("無法獲取 GPS 位置，已切換至預設位置 (旺角)", "info");
                    fallbackLocation();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
            );
        }

        function fallbackLocation() {
            // Default to Mong Kok, Hong Kong
            setUserLocation(22.3193, 114.1694, "旺角 Mong Kok (預設位置)");
        }

        function setUserLocation(lat, lng, labelText) {
            userCoords = { lat, lng };
            gpsIcon.className = "fa-solid fa-location-dot text-kmb-red";
            locationTitle.textContent = labelText;
            locationCoords.textContent = `緯度: ${lat.toFixed(4)}, 經度: ${lng.toFixed(4)}`;
            
            renderNearbyStops();
        }

        // Haversine Formula for distance between two lat/lng in meters
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Radius of the Earth in meters
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        async function renderNearbyStops() {
            if (!userCoords || kmbStopsData.length === 0) return;

            nearbyStopsContainer.innerHTML = '';
            nearbyLoading.classList.remove('hidden');
            nearbyLoadingText.textContent = `搜尋 ${selectedRadius} 米範圍內的九巴車站...`;

            // Calculate distance to all stops
            let stopsWithDist = kmbStopsData.map(stop => {
                const dist = getDistanceMeters(
                    userCoords.lat, 
                    userCoords.lng, 
                    parseFloat(stop.lat), 
                    parseFloat(stop.long)
                );
                return { ...stop, dist };
            });

            // Filter by distance and sort
            stopsWithDist = stopsWithDist.filter(s => s.dist <= selectedRadius).sort((a, b) => a.dist - b.dist);

            nearbyLoading.classList.add('hidden');

            if (stopsWithDist.length === 0) {
                nearbyStopsContainer.innerHTML = `
                    <div class="text-center py-10 bg-white dark:bg-gray-900 rounded-2xl p-6 border border-gray-200 dark:border-gray-800">
                        <i class="fa-solid fa-person-walking text-3xl text-gray-400 mb-2"></i>
                        <h4 class="text-sm font-bold text-gray-800 dark:text-gray-200">${selectedRadius} 米內未有發現九巴車站</h4>
                        <p class="text-xs text-gray-500 mt-1">請嘗試放大上方搜尋範圍（例如 500m 或 1km）或切換地區。</p>
                    </div>`;
                return;
            }

            // Limit to closest 8 stops to prevent API spam
            const displayStops = stopsWithDist.slice(0, 8);

            for (const stop of displayStops) {
                const stopCard = document.createElement('div');
                stopCard.className = "bg-white dark:bg-gray-900 rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-gray-800 space-y-3";
                
                stopCard.innerHTML = `
                    <div class="flex items-start justify-between border-b border-gray-100 dark:border-gray-800/80 pb-2.5">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-xl bg-kmb-red text-white flex items-center justify-center font-bold text-xs shrink-0">
                                九巴
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-gray-900 dark:text-white">${stop.name_tc}</h3>
                                <p class="text-[11px] text-gray-500">${stop.name_en}</p>
                            </div>
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-red-500/10 text-kmb-red text-xs font-bold shrink-0 border border-red-500/20">
                            ${stop.dist} 米
                        </span>
                    </div>

                    <!-- ETAs Container -->
                    <div id="etas_for_${stop.stop}" class="space-y-2 py-1">
                        <div class="flex items-center justify-center py-3 text-xs text-gray-400 space-x-2">
                            <i class="fa-solid fa-spinner animate-spin text-kmb-red"></i>
                            <span>即時獲取 ETA 到站時間...</span>
                        </div>
                    </div>
                `;

                nearbyStopsContainer.appendChild(stopCard);

                // Fetch real-time ETAs for this stop from Official KMB API
                fetchStopETAs(stop.stop, `etas_for_${stop.stop}`, stop.name_tc);
            }
        }

        async function fetchStopETAs(stopId, containerId, stopName) {
            const container = document.getElementById(containerId);
            if (!container) return;

            try {
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const json = await response.json();

                if (!json || !json.data || json.data.length === 0) {
                    container.innerHTML = `<div class="text-xs text-gray-400 italic py-1">目前無即時班次資料 / 服務時間已過</div>`;
                    return;
                }

                // Group ETAs by Route + Direction
                const groupedETAs = {};
                json.data.forEach(item => {
                    if (!item.route || !item.eta) return;
                    
                    const key = `${item.route}_${item.dir}_${item.dest_tc}`;
                    if (!groupedETAs[key]) {
                        groupedETAs[key] = {
                            route: item.route,
                            dest_tc: item.dest_tc,
                            dest_en: item.dest_en,
                            service_type: item.service_type,
                            dir: item.dir,
                            seq: item.seq,
                            etas: []
                        };
                    }
                    groupedETAs[key].etas.push(item);
                });

                const routeKeys = Object.keys(groupedETAs);
                if (routeKeys.length === 0) {
                    container.innerHTML = `<div class="text-xs text-gray-400 italic py-1">無即時預報資料</div>`;
                    return;
                }

                let html = '';
                routeKeys.forEach(key => {
                    const group = groupedETAs[key];
                    const isFav = isFavorite(stopId, group.route);

                    html += `
                        <div class="p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800/60 border border-gray-100 dark:border-gray-800 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <span class="px-2.5 py-1 rounded-lg bg-kmb-red text-white text-xs font-black shadow-xs shrink-0">
                                    ${group.route}
                                </span>
                                <div>
                                    <div class="text-xs font-bold text-gray-800 dark:text-gray-200">
                                        往 ${group.dest_tc}
                                    </div>
                                    <div class="text-[10px] text-gray-400">${group.dest_en}</div>
                                </div>
                            </div>

                            <div class="flex items-center space-x-3">
                                <div class="flex flex-col items-end gap-1">
                                    ${group.etas.slice(0, 2).map(e => formatEtaBadge(e.eta, e.rmk_tc)).join('')}
                                </div>
                                <button onclick="toggleFavoriteStop('${stopId}', '${group.route}', '${stopName.replace(/'/g, "\\'")}', '${group.dest_tc}')" class="p-1.5 text-base hover:scale-110 transition ${isFav ? 'text-amber-400' : 'text-gray-300 dark:text-gray-600 hover:text-amber-400'}">
                                    <i class="fa-${isFav ? 'solid' : 'regular'} fa-star"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error("Failed to fetch stop ETA:", err);
                container.innerHTML = `<div class="text-xs text-red-400 py-1">ETA 載入失敗 (網絡連線問題)</div>`;
            }
        }

        function formatEtaBadge(etaIsoString, remark) {
            if (!etaIsoString) {
                return `<span class="text-[10px] px-2 py-0.5 rounded bg-gray-200 dark:bg-gray-700 text-gray-500">${remark || '原定班次'}</span>`;
            }

            const etaTime = new Date(etaIsoString);
            const now = new Date();
            const diffMs = etaTime - now;
            const diffMins = Math.round(diffMs / 60000);

            let badgeClass = "bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300";
            let text = "";

            if (diffMins <= 1) {
                badgeClass = "bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-extrabold border border-emerald-500/30 pulse-ring";
                text = "即將到達 Arriving";
            } else if (diffMins <= 8) {
                badgeClass = "bg-amber-500/15 text-amber-600 dark:text-amber-400 font-bold border border-amber-500/30";
                text = `${diffMins} 分鐘`;
            } else {
                badgeClass = "bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 font-medium border border-gray-200 dark:border-gray-700";
                text = `${diffMins} 分鐘`;
            }

            const timeStr = etaTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return `
                <span class="px-2 py-0.5 rounded-md text-xs ${badgeClass} inline-flex items-center gap-1">
                    <span>${text}</span>
                    <span class="text-[9px] opacity-70">(${timeStr})</span>
                </span>
            `;
        }

        async function searchKmbRoute(routeNum) {
            routeSearchResults.innerHTML = `
                <div class="flex items-center justify-center py-8 text-xs text-gray-400 space-x-2">
                    <i class="fa-solid fa-spinner animate-spin text-kmb-red"></i>
                    <span>搜尋路線 ${routeNum} 中...</span>
                </div>`;

            try {
                // Fetch route info from KMB API
                const resp = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${routeNum}/outbound/1`);
                const json = await resp.json();

                if (!json || !json.data) {
                    routeSearchResults.innerHTML = `
                        <div class="text-center py-8 text-xs text-gray-400">
                            未有找到路線 ${routeNum}
                        </div>`;
                    return;
                }

                const routeData = json.data;

                routeSearchResults.innerHTML = `
                    <div class="bg-white dark:bg-gray-900 rounded-2xl p-4 border border-gray-200 dark:border-gray-800 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="px-3 py-1 rounded-xl bg-kmb-red text-white text-base font-black">
                                路線 ${routeData.route}
                            </span>
                            <span class="text-xs font-semibold text-gray-500">
                                ${routeData.orig_tc} ➔ ${routeData.dest_tc}
                            </span>
                        </div>
                        <div class="text-xs text-gray-400">
                            ${routeData.orig_en} to ${routeData.dest_en}
                        </div>
                        <button onclick="fetchRouteStops('${routeData.route}', 'outbound')" class="w-full py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-kmb-red hover:text-white transition font-bold text-xs">
                            查看去程車站列表 Stop List
                        </button>
                    </div>
                    <div id="routeStopsList" class="space-y-2"></div>
                `;

            } catch (err) {
                routeSearchResults.innerHTML = `<div class="text-center py-6 text-xs text-red-400">搜尋失敗，請再試一次</div>`;
            }
        }

        async function fetchRouteStops(route, bound) {
            const listContainer = document.getElementById('routeStopsList');
            if (!listContainer) return;

            listContainer.innerHTML = `
                <div class="flex items-center justify-center py-6 text-xs text-gray-400 space-x-2">
                    <i class="fa-solid fa-spinner animate-spin text-kmb-red"></i>
                    <span>載入車站列表中...</span>
                </div>`;

            try {
                const resp = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${bound}/1`);
                const json = await resp.json();

                if (!json || !json.data) {
                    listContainer.innerHTML = `<div class="text-xs text-gray-400 py-2">無法載入車站列表</div>`;
                    return;
                }

                const stopsList = json.data;
                let html = '<div class="space-y-2 mt-3">';

                for (const item of stopsList.slice(0, 15)) {
                    // Match with local stop database to get Chinese name
                    const stopInfo = kmbStopsData.find(s => s.stop === item.stop) || { name_tc: `車站 ${item.stop}`, name_en: item.stop };

                    html += `
                        <div class="p-3 rounded-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <span class="w-6 h-6 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-[10px] flex items-center justify-center shrink-0">
                                    ${item.seq}
                                </span>
                                <div>
                                    <div class="text-xs font-bold text-gray-800 dark:text-gray-200">${stopInfo.name_tc}</div>
                                    <div class="text-[10px] text-gray-400">${stopInfo.name_en}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
                listContainer.innerHTML = html;

            } catch (err) {
                listContainer.innerHTML = `<div class="text-xs text-red-400 py-2">載入車站失敗</div>`;
            }
        }

        function loadSavedFavorites() {
            try {
                const saved = localStorage.getItem('kmb_fav_stops');
                favoritesList = saved ? JSON.parse(saved) : [];
            } catch (e) {
                favoritesList = [];
            }
            updateFavCount();
        }

        function saveFavorites() {
            localStorage.setItem('kmb_fav_stops', JSON.stringify(favoritesList));
            updateFavCount();
        }

        function updateFavCount() {
            favCountText.textContent = favoritesList.length;
        }

        function isFavorite(stopId, route) {
            return favoritesList.some(f => f.stopId === stopId && f.route === route);
        }

        function toggleFavoriteStop(stopId, route, stopName, destName) {
            const index = favoritesList.findIndex(f => f.stopId === stopId && f.route === route);
            if (index > -1) {
                favoritesList.splice(index, 1);
                showToast(`已從收藏移除 ${route} (往 ${destName})`, "info");
            } else {
                favoritesList.push({ stopId, route, stopName, destName });
                showToast(`已收藏 ${route} (往 ${destName})`, "success");
            }
            saveFavorites();
            
            // Re-render
            const currentTab = document.querySelector('.tab-btn.text-kmb-red')?.getAttribute('data-tab');
            if (currentTab === 'favorites') renderFavorites();
            if (currentTab === 'nearby') renderNearbyStops();
        }

        function renderFavorites() {
            favoritesContainer.innerHTML = '';

            if (favoritesList.length === 0) {
                favoritesContainer.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-gray-900 rounded-2xl p-6 border border-gray-200 dark:border-gray-800 space-y-2">
                        <i class="fa-solid fa-star text-3xl text-gray-300 dark:text-gray-700"></i>
                        <h4 class="text-xs font-bold text-gray-500">未有收藏路線或車站</h4>
                        <p class="text-[11px] text-gray-400">在「附近車站」中點擊星星圖示以加入快捷瀏覽。</p>
                    </div>`;
                return;
            }

            favoritesList.forEach(fav => {
                const favCard = document.createElement('div');
                favCard.className = "bg-white dark:bg-gray-900 rounded-2xl p-3.5 border border-gray-200 dark:border-gray-800 shadow-sm space-y-2";
                
                favCard.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2.5">
                            <span class="px-2.5 py-1 rounded-lg bg-kmb-red text-white text-xs font-black">
                                ${fav.route}
                            </span>
                            <div>
                                <div class="text-xs font-bold text-gray-900 dark:text-white">往 ${fav.destName}</div>
                                <div class="text-[10px] text-gray-500">${fav.stopName}</div>
                            </div>
                        </div>
                        <button onclick="toggleFavoriteStop('${fav.stopId}', '${fav.route}', '${fav.stopName}', '${fav.destName}')" class="text-amber-400 text-base p-1">
                            <i class="fa-solid fa-star"></i>
                        </button>
                    </div>

                    <div id="fav_eta_${fav.stopId}_${fav.route}" class="pt-1">
                        <div class="flex items-center space-x-2 text-xs text-gray-400">
                            <i class="fa-solid fa-spinner animate-spin text-kmb-red"></i>
                            <span>載入預報中...</span>
                        </div>
                    </div>
                `;

                favoritesContainer.appendChild(favCard);

                // Fetch real ETA for this saved stop + route
                fetchSingleRouteETA(fav.stopId, fav.route, `fav_eta_${fav.stopId}_${fav.route}`);
            });
        }

        async function fetchSingleRouteETA(stopId, route, elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;

            try {
                const resp = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const json = await resp.json();

                if (!json || !json.data) {
                    el.innerHTML = `<span class="text-xs text-gray-400">無班次資料</span>`;
                    return;
                }

                const filtered = json.data.filter(item => item.route === route);
                if (filtered.length === 0) {
                    el.innerHTML = `<span class="text-xs text-gray-400">尾班車已過 / 暫無服務</span>`;
                    return;
                }

                el.innerHTML = `
                    <div class="flex flex-wrap gap-2">
                        ${filtered.slice(0, 2).map(e => formatEtaBadge(e.eta, e.rmk_tc)).join('')}
                    </div>
                `;

            } catch (err) {
                el.innerHTML = `<span class="text-xs text-red-400">ETA 獲取失敗</span>`;
            }
        }

        function showToast(msg, type = "info") {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            toastText.textContent = msg;

            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-red-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-blue-400";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>

</html>
